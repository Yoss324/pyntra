name: "hydra"
command: "hydra"
enabled: true
short_description: "Wrapper for the hydra command"
description: |
  Wrapper for the $toolName command or embedded helper script.

  **Key Features:**
  - Structured parameters for repeatable execution
  - Suitable for security testing and automation workflows
  - Returns command output for further orchestration

  **Use Cases:**
  - Targeted validation and assessment tasks
  - Repeatable command execution from the agent runtime
  - Evidence collection in larger workflows

  **Key Features：**

  **Use Cases：**
  - Penetration testing
  - Security assessment
parameters:
  - name: "target"
    type: "string"
    description: "Target host or address."
    required: true
    position: 0
    format: "positional"
  - name: "service"
    type: "string"
    description: "Parameter for the hydra tool."
    required: true
    position: 1
    format: "positional"
  - name: "username"
    type: "string"
    description: "Username."
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Parameter for the hydra tool."
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password or secret."
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Parameter for the hydra tool."
    required: false
    flag: "-P"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional arguments to append to the command."
    required: false
    format: "positional"
