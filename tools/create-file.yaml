name: "create-file"
command: "python3"
args:
  - "-c"
  - |
    import base64
    import sys
    from pathlib import Path

    if len(sys.argv) < 3:
        sys.stderr.write("Usage: create-file <filename> <content> [binary]\n")
        sys.exit(1)

    filename = sys.argv[1]
    content = sys.argv[2]
    binary_arg = sys.argv[3].lower() if len(sys.argv) > 3 else "false"
    binary = binary_arg in ("1", "true", "yes", "on")

    path = Path(filename)
    if not path.is_absolute():
        path = Path.cwd() / path
    path.parent.mkdir(parents=True, exist_ok=True)

    if binary:
        data = base64.b64decode(content)
        path.write_bytes(data)
    else:
        path.write_text(content, encoding="utf-8")

    print(f"File created: {path}")
enabled: true
short_description: "Wrapper for the create-file command"
