parameters:

  - name: "query"
    type: "string"
    description: |
      Search or query expression.

      Search query string supporting FOFA syntax.
      Examples:
      - app="Apache"
      - title="login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
      Number of results to return.

      Number of results returned per page. Default: 100.
      Allowed range: 1-10000, subject to account limits.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
      Results page number.

      Page number to return. Starts at 1. Default: 1.
      Use for paginating large result sets.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
      Fields to request from the remote service.

      Fields to return, separated by commas.
      Default fields: ip,port,domain
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
      Whether to request complete results.

      Set to true to request full data. Requires elevated permissions.
      Default: false, returns basic data.
    required: false
    position: 6
    format: "positional"
    default: false
