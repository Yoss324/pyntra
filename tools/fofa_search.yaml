name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== FOFA configuration ====================
    # Configure your FOFA account details here
    # You can also set these values with the FOFA_EMAIL and FOFA_API_KEY environment variables
    FOFA_EMAIL = ""  # Enter your FOFA account email
    FOFA_API_KEY = ""  # Enter your FOFA API key
    # ==================================================

    # FOFA API base URL
    base_url = "https://fofa.info/api/v1/search/all"

    # Parse arguments (from a JSON string or command-line arguments)
    def parse_args():
        # Try reading JSON configuration from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try parsing JSON
                config = json.loads(arg1)
                # Ensure the returned value is a dictionary
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # If the value is not JSON, fall back to positional arguments
                pass

        # Legacy positional arguments (backward compatible)
        # Parameter positions: query=2, size=3, page=4, fields=5, full=6
        # sys.argv[0] is '-c' and actual parameters start at sys.argv[1]
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

        # Ensure config is a dictionary
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Argument parsing error: expected a dictionary, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Read email and api_key from configuration or the environment
        email = os.getenv('FOFA_EMAIL', FOFA_EMAIL).strip()
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not email:
            error_result = {
                "status": "error",
                "required_config": ["email", "api_key"],
                "note": "Set your FOFA account email in the YAML file or with the FOFA_EMAIL environment variable"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not api_key:
            error_result = {
                "status": "error",
                "required_config": ["email", "api_key"],
                "note": "Set your FOFA API key in the YAML file or with the FOFA_API_KEY environment variable. You can retrieve the key from the FOFA user center: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="login"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Build request parameters
        params = {
            'email': email,
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional parameters
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

        # Send request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # Check for FOFA API errors
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API error: {result_data.get('errmsg', 'Unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Check whether the API key is correct and whether the query matches FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f"Successfully retrieved {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Check network connectivity or the FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
