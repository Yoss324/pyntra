name: "pwntools"
command: "python3"
args:
  - "-c"
  - |
    import os
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("Missing script content\n")
        sys.exit(1)

    script_content = sys.argv[1]
    target_binary = sys.argv[2] if len(sys.argv) > 2 else ""
    target_host = sys.argv[3] if len(sys.argv) > 3 else ""
    target_port = sys.argv[4] if len(sys.argv) > 4 else ""
    exploit_type = sys.argv[5] if len(sys.argv) > 5 else "local"

    if target_binary:
        os.environ["PWN_BINARY"] = target_binary
    if target_host:
        os.environ["PWN_HOST"] = target_host
    if target_port:
        os.environ["PWN_PORT"] = str(target_port)
    if exploit_type:
        os.environ["PWN_EXPLOIT_TYPE"] = exploit_type

    exec(script_content, {})
enabled: true
short_description: "Wrapper for the pwntools command"
description: |
  Wrapper for the $toolName command or embedded helper script.

  **Key Features:**
  - Structured parameters for repeatable execution
  - Suitable for security testing and automation workflows
  - Returns command output for further orchestration

  **Use Cases:**
  - Targeted validation and assessment tasks
  - Repeatable command execution from the agent runtime
  - Evidence collection in larger workflows
parameters:
  - name: "script_content"
    type: "string"
    description: "Parameter for the pwntools tool."
    required: true
    position: 0
    format: "positional"
  - name: "target_binary"
    type: "string"
    description: "Parameter for the pwntools tool."
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "target_host"
    type: "string"
    description: "Parameter for the pwntools tool."
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "target_port"
    type: "string"
    description: "Parameter for the pwntools tool."
    required: false
    default: ""
    position: 3
    format: "positional"
  - name: "exploit_type"
    type: "string"
    description: "Parameter for the pwntools tool."
    required: false
    default: "local"
    position: 4
    format: "positional"
