name: "rpcclient"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.exit(1)

    target = sys.argv[1]
    username = sys.argv[2] if len(sys.argv) > 2 else ""
    password = sys.argv[3] if len(sys.argv) > 3 else ""
    domain = sys.argv[4] if len(sys.argv) > 4 else ""
    commands = sys.argv[5] if len(sys.argv) > 5 else ""
    extra = sys.argv[6] if len(sys.argv) > 6 else ""

    cmd = ["rpcclient"]

    if username:
        cred = username
        if password:
            cred = f"{username}%{password}"
        cmd.extend(["-U", cred])
    elif password:
        cmd.extend(["-U", f"%{password}"])

    if domain:
        cmd.extend(["-W", domain])

    if commands:
        cmd.extend(["-c", commands])

    if extra:
        cmd.extend(shlex.split(extra))

    cmd.append(target)

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Wrapper for the rpcclient command"
description: |
  Wrapper for the $toolName command or embedded helper script.

  **Key Features:**
  - Structured parameters for repeatable execution
  - Suitable for security testing and automation workflows
  - Returns command output for further orchestration

  **Use Cases:**
