    default: "rop"
  - name: "quality"
    type: "int"
    description: "Parameter for the ropper tool."
    required: false
    flag: "--quality"
    format: "flag"
    default: 1
  - name: "arch"
    type: "string"
    description: "Parameter for the ropper tool."
    required: false
    flag: "--arch"
    format: "flag"
  - name: "search_string"
    type: "string"
    description: "Parameter for the ropper tool."
    required: false
    flag: "--search"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional arguments to append to the command.

      **Notes:**
      - Separate multiple arguments with spaces.
      - Ensure values are well-formed and safe for command execution.
      - This text is appended directly to the end of the command.

      **Example Values：**
      - Add common examples based on the tool behavior

      **Notes：**
      - Separate multiple arguments with spaces
