name: "shodan_search"
command: "python3"
enabled: true
short_description: "Query the Shodan internet-wide host search API (FOFA equivalent)."
description: |
  Search Shodan (https://www.shodan.io) for internet-exposed hosts and services.
  Western equivalent of FOFA / Quake / ZoomEye for asset discovery and recon.

  **Auth:** set the `SHODAN_API_KEY` environment variable before starting the server.

  **Query examples:**
  - `product:nginx`
  - `apache country:DE`
  - `port:22 org:"Amazon"`
  - `ssl.cert.subject.cn:example.com`
  - `http.title:"index of"`

  **Returns:** JSON with `total` and a `results` list (ip, port, org, hostnames, product, http.title).
args:
  - "-c"
  - |
    import sys, os, json, urllib.parse, urllib.request

    api_key = os.getenv("SHODAN_API_KEY", "").strip()
    query = sys.argv[1].strip() if len(sys.argv) > 1 else ""
    try:
        limit = int(sys.argv[2]) if len(sys.argv) > 2 else 50
    except (ValueError, TypeError):
        limit = 50
    limit = max(1, min(limit, 100))

    if not api_key:
        print(json.dumps({"status": "error", "message": "SHODAN_API_KEY environment variable is not set"}))
        sys.exit(1)
    if not query:
        print(json.dumps({"status": "error", "message": "Missing required parameter: query"}))
        sys.exit(1)

    params = urllib.parse.urlencode({"key": api_key, "query": query, "minify": "true"})
    url = "https://api.shodan.io/shodan/host/search?" + params
    try:
        with urllib.request.urlopen(url, timeout=30) as resp:
            data = json.loads(resp.read().decode("utf-8", "replace"))
    except urllib.error.HTTPError as e:
        body = e.read().decode("utf-8", "replace")[:300]
        print(json.dumps({"status": "error", "status_code": e.code, "message": body}))
        sys.exit(1)
    except Exception as e:
        print(json.dumps({"status": "error", "message": str(e)}))
        sys.exit(1)

    matches = data.get("matches", [])[:limit]
    results = []
    for m in matches:
        results.append({
            "ip": m.get("ip_str"),
            "port": m.get("port"),
            "org": m.get("org"),
            "hostnames": m.get("hostnames"),
            "product": m.get("product"),
            "title": (m.get("http") or {}).get("title") if isinstance(m.get("http"), dict) else None,
        })
    print(json.dumps({
        "status": "success",
        "query": query,
        "total": data.get("total", 0),
        "results_count": len(results),
        "results": results,
    }, ensure_ascii=False, indent=2))
parameters:
  - name: "query"
    type: "string"
    description: |
      Shodan search query. Examples: `product:nginx`, `port:22 country:DE`,
      `ssl.cert.subject.cn:example.com`, `org:"Amazon" port:443`.
    required: true
    position: 0
    format: "positional"
  - name: "limit"
    type: "int"
    description: "Maximum number of results to return (1-100, default 50)."
    required: false
    position: 1
    format: "positional"
    default: 50
