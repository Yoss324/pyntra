name: "jaeles"
command: "jaeles"
args: ["scan"]
enabled: true
short_description: "Wrapper for the jaeles command"
description: |
  Wrapper for the $toolName command or embedded helper script.

  **Key Features:**
  - Structured parameters for repeatable execution
  - Suitable for security testing and automation workflows
  - Returns command output for further orchestration

  **Use Cases:**
  - Targeted validation and assessment tasks
  - Repeatable command execution from the agent runtime
  - Evidence collection in larger workflows

  **Key Features：**
  - Fast scanning
  - Detailed reports

  **Use Cases：**
  - Vulnerability scanning
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL."
    required: true
    flag: "-u"
    format: "flag"
  - name: "signatures"
    type: "string"
    description: "Parameter for the jaeles tool."
    required: false
    flag: "-s"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Parameter for the jaeles tool."
    required: false
    flag: "-c"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of worker threads to use."
    required: false
    flag: "-t"
    format: "flag"
    default: 20
  - name: "timeout"
    type: "int"
    description: "Timeout in seconds."
    required: false
    flag: "--timeout"
    format: "flag"
    default: 20
  - name: "additional_args"
    type: "string"
    description: |
      Additional arguments to append to the command.

      **Notes:**
      - Separate multiple arguments with spaces.
      - Ensure values are well-formed and safe for command execution.
      - This text is appended directly to the end of the command.

      **Example Values：**
      - Add common examples based on the tool behavior

      **Notes：**
      - Separate multiple arguments with spaces
      - This value is appended directly to the end of the command
    required: false
    format: "positional"
