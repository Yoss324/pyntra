name: "x8"
command: "x8"
enabled: true
short_description: "Wrapper for the x8 command"
description: |
  Wrapper for the $toolName command or embedded helper script.

  **Key Features:**
  - Structured parameters for repeatable execution
  - Suitable for security testing and automation workflows
  - Returns command output for further orchestration

  **Use Cases:**
  - Targeted validation and assessment tasks
  - Repeatable command execution from the agent runtime
  - Evidence collection in larger workflows

  **Key Features：**
  - Fast scanning

  **Use Cases：**
  - Parameter discovery
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL."
    required: true
    flag: "--url"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file."
    required: false
    flag: "--wordlist"
    format: "flag"
    default: "/usr/share/wordlists/x8/params.txt"
  - name: "method"
    type: "string"
    description: "HTTP method to use."
    required: false
    flag: "--method"
    format: "flag"
    default: "GET"
  - name: "body"
    type: "string"
    description: "Parameter for the x8 tool."
    required: false
    flag: "--body"
    format: "flag"
  - name: "headers"
    type: "string"
    description: "Parameter for the x8 tool."
    required: false
    flag: "--headers"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional arguments to append to the command.

      **Notes:**
      - Separate multiple arguments with spaces.
      - Ensure values are well-formed and safe for command execution.
      - This text is appended directly to the end of the command.

      **Example Values：**
      - Add common examples based on the tool behavior

      **Notes：**
      - Separate multiple arguments with spaces
      - This value is appended directly to the end of the command
    required: false
    format: "positional"
