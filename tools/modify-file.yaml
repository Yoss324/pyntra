name: "modify-file"
command: "python3"
args:
  - "-c"
  - |
    import sys
    from pathlib import Path

    if len(sys.argv) < 3:
        sys.stderr.write("Usage: modify-file <filename> <content> [append]\n")
        sys.exit(1)

    filename = sys.argv[1]
    content = sys.argv[2]
    append_arg = sys.argv[3].lower() if len(sys.argv) > 3 else "false"
    append = append_arg in ("1", "true", "yes", "on")

    path = Path(filename)
    if not path.is_absolute():
        path = Path.cwd() / path
    path.parent.mkdir(parents=True, exist_ok=True)

    mode = "a" if append else "w"
    with path.open(mode, encoding="utf-8") as f:
        f.write(content)

    action = "Append" if append else "Overwrite"
    print(f"{action} write completed: {path}")
enabled: true
short_description: "Wrapper for the modify-file command"
