    position: 1
    format: "positional"
  - name: "location"
    type: "string"
    description: "Parameter for the http-intruder tool."
    required: false
    default: "query"
    position: 2
    format: "positional"
  - name: "params"
    type: "object"
    description: "Parameter for the http-intruder tool."
    required: true
    position: 3
    format: "positional"
  - name: "payloads"
    type: "array"
    item_type: "string"
    description: "Parameter for the http-intruder tool."
    required: true
    position: 4
    format: "positional"
  - name: "max_requests"
    type: "int"
    description: "Parameter for the http-intruder tool."
    required: false
    default: 0
    position: 5
    format: "positional"
