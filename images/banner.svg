<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pyntra — AI-native security testing platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#4493f8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ee"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2b3550" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <rect width="1280" height="380" fill="url(#glow)"/>
  <rect width="1280" height="380" fill="url(#glow2)"/>

  <!-- Logo mark: rounded square with stylized P + scanning aperture -->
  <g transform="translate(96,116)">
    <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#mark)"/>
    <rect x="0" y="0" width="128" height="128" rx="30" fill="#ffffff" opacity="0.04"/>
    <path d="M40 34h26a20 20 0 0 1 0 40H55v18H40V34zm15 13v14h11a7 7 0 0 0 0-14H55z" fill="#ffffff"/>
    <circle cx="88" cy="90" r="11" fill="none" stroke="#ffffff" stroke-width="6"/>
    <line x1="96" y1="98" x2="106" y2="108" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="268" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#word)" letter-spacing="-2">Pyntra</text>
  <text x="272" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#8b98b0">AI-native security testing platform</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <g transform="translate(272,258)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#1b2436" stroke="#2f3c58"/>
      <circle cx="24" cy="20" r="5" fill="#4493f8"/>
      <text x="40" y="27" fill="#c9d6ee">AI Agents</text>
    </g>
    <g transform="translate(434,258)">
      <rect x="0" y="0" width="92" height="40" rx="20" fill="#1b2436" stroke="#2f3c58"/>
      <circle cx="24" cy="20" r="5" fill="#34d399"/>
      <text x="40" y="27" fill="#c9d6ee">MCP</text>
    </g>
    <g transform="translate(538,258)">
      <rect x="0" y="0" width="92" height="40" rx="20" fill="#1b2436" stroke="#2f3c58"/>
      <circle cx="24" cy="20" r="5" fill="#a78bfa"/>
      <text x="40" y="27" fill="#c9d6ee">RAG</text>
    </g>
    <g transform="translate(642,258)">
      <rect x="0" y="0" width="186" height="40" rx="20" fill="#1b2436" stroke="#2f3c58"/>
      <circle cx="24" cy="20" r="5" fill="#f59e0b"/>
      <text x="40" y="27" fill="#c9d6ee">Attack Chains</text>
    </g>
    <g transform="translate(840,258)">
      <rect x="0" y="0" width="112" height="40" rx="20" fill="#1b2436" stroke="#2f3c58"/>
      <circle cx="24" cy="20" r="5" fill="#f472b6"/>
      <text x="40" y="27" fill="#c9d6ee">Bots</text>
    </g>
  </g>

  <!-- Right-side terminal motif -->
  <g transform="translate(972,96)" opacity="0.96">
    <rect x="0" y="0" width="236" height="188" rx="14" fill="#0b1120" stroke="#26324c"/>
    <rect x="0" y="0" width="236" height="34" rx="14" fill="#141d31"/>
    <rect x="0" y="20" width="236" height="14" fill="#141d31"/>
    <circle cx="20" cy="17" r="5" fill="#f87171"/>
    <circle cx="40" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="17" r="5" fill="#34d399"/>
    <g font-family="Consolas, Menlo, monospace" font-size="14">
      <text x="18" y="64" fill="#4493f8">pyntra&#8202;&gt;</text>
      <text x="74" y="64" fill="#c9d6ee">scan target</text>
      <text x="18" y="90" fill="#8b98b0">recon</text>
      <text x="66" y="90" fill="#34d399">shodan &#10003;</text>
      <text x="18" y="116" fill="#8b98b0">recon</text>
      <text x="66" y="116" fill="#34d399">censys &#10003;</text>
      <text x="18" y="142" fill="#8b98b0">chain</text>
      <text x="64" y="142" fill="#f59e0b">4 steps</text>
      <text x="18" y="168" fill="#4493f8">&#9608;</text>
    </g>
  </g>
</svg>
